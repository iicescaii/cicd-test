# nginx in front of the two app containers.
# Install: sudo cp nginx-app.conf /etc/nginx/sites-available/app
#          sudo ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
#          sudo nginx -t && sudo systemctl reload nginx
#
# WSL test: open http://staging.localhost and http://app.localhost in the Windows browser.
# Real VPS: change server_name to the real domains, then get free HTTPS with
#           sudo certbot --nginx -d example.com -d staging.example.com

server {
    listen 80;
    listen [::]:80;                             # IPv6 too: browsers often try ::1 first for *.localhost
    server_name staging.localhost;              # VPS: staging.example.com
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                     # Next.js streaming reaches the browser right away
    }
}

server {
    listen 80;
    listen [::]:80;                             # IPv6 too: browsers often try ::1 first for *.localhost
    server_name app.localhost;                  # VPS: example.com

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
